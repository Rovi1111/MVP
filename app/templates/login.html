{% extends "base.html" %}
{% block title %}Вход — {{ app_name }}{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Вход</h1>
  {% if error %}<p class="alert error">{{ error }}</p>{% endif %}
  <form method="post" action="/web/login" class="stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Логин
      <input name="login" value="{{ login or '' }}" autocomplete="username" required autofocus>
    </label>
    <label>Пароль
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <button type="submit">Войти</button>
  </form>
</section>
{% endblock %}
