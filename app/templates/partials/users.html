<div id="users">
  <section class="card">
    <h2>Новый пользователь</h2>
    <form class="row" hx-post="/web/users" hx-target="#users" hx-swap="outerHTML">
      <label>Логин <input name="login" required maxlength="100" autocomplete="off"></label>
      <label>ФИО <input name="full_name" maxlength="200"></label>
      <label>Пароль (от 8 символов) <input type="password" name="password" required minlength="8" autocomplete="new-password"></label>
      <label>Роль
        <select name="role">{% for code, title in roles.items() %}<option value="{{ code.value }}" {% if code.value == "employee" %}selected{% endif %}>{{ title }}</option>{% endfor %}</select>
      </label>
      <button type="submit">Создать</button>
    </form>
  </section>
  <section class="card table-wrap">
    <table>
      <thead><tr><th>Логин</th><th>ФИО</th><th>Роль</th><th>Активен</th><th>Новый пароль</th><th></th></tr></thead>
      <tbody>
        {% for u in users %}
        <tr {% if not u.is_active %}class="inactive"{% endif %}>
          <td>{{ u.login }}{% if u.id == user.id %} <span class="muted small">(вы)</span>{% endif %}</td>
          <td><input form="user-{{ u.id }}" name="full_name" value="{{ u.full_name }}" maxlength="200"></td>
          <td>
            <select form="user-{{ u.id }}" name="role">
              {% for code, title in roles.items() %}<option value="{{ code.value }}" {% if code.value == u.role %}selected{% endif %}>{{ title }}</option>{% endfor %}
            </select>
          </td>
          <td><input form="user-{{ u.id }}" type="checkbox" name="is_active" value="true" {% if u.is_active %}checked{% endif %}></td>
          <td><input form="user-{{ u.id }}" type="password" name="password" placeholder="не менять" minlength="8" autocomplete="new-password"></td>
          <td><form id="user-{{ u.id }}" hx-post="/web/users/{{ u.id }}" hx-target="#users" hx-swap="outerHTML">
            <button class="secondary" type="submit">Сохранить</button></form></td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </section>
</div>
